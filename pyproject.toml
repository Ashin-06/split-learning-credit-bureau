[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "split-learning-credit-bureau"
version = "1.0.0"
description = "Private set intersection and split learning across a bank, a payments app and a telecom for credit scoring"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.24",
    "scikit-learn>=1.2",
    "pynacl>=1.5",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "pydantic>=2.6",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "prometheus-client>=0.20",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "httpx2>=2.0", "ruff>=0.6", "bandit>=1.7", "pip-audit>=2.7", "pandas>=2.0"]
realdata = ["pandas>=2.0", "xlrd>=2.0.1"]

[project.scripts]
splitbureau = "splitbureau.__main__:main"

[tool.setuptools]
packages = ["splitbureau"]

[tool.setuptools.package-data]
splitbureau = ["migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
source = ["splitbureau"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B"]
ignore = ["B008", "B905"]  # Depends() defaults are FastAPI's idiom; zip(strict=) is style
